[project]
name = "ssserve"
version = "0.4.0"
dynamic = ["description"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.0"]
license = "MIT"

[project.scripts]
ssserve = "ssserve.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ssserve"]

[tool.pytest.ini_options]
markers = [
    "profile: profiling tests (CPU, memory, sampling)",
    "c_server_config: C server config for redirects/rewrites",
    "slow: slow tests (performance, resources, profiling)",
]
testpaths = ["tests"]
addopts = "-n auto --cov=ssserve --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C90",  # mccabe complexity
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
mccabe = { max-complexity = 22 }

[tool.ruff.lint.per-file-ignores]
"ssserve/listing.py" = ["E501"]  # CSS template strings are intentionally long

[tool.mypy]
python_version = "3.10"
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_return_any = true
warn_unused_configs = true

[tool.vulture]
min_confidence = 80
paths = ["ssserve"]

[tool.mutmut]
paths_to_mutate = "ssserve/"
tests_dir = "tests/"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.0",
    "pytest-cov>=5.0",
    "psutil>=6",
    "asv>=0.6.5",
    "setuptools>=83.0.0",
    "build",
    "memray>=1.12",
    "py-spy>=0.3.14",
    "radon>=6.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "vulture>=2.10",
    "mutmut>=3.0",
]
