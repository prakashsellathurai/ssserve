[project]
name = "ssserve"
version = "0.3.3"
dynamic = ["description"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.0"]
license = "MIT"

[project.scripts]
ssserve = "ssserve.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ssserve"]

[[tool.setuptools.ext-modules]]
name = "ssserve._fastops"
sources = ["ssserve/_fastops.c"]
libraries = ["z"]

[[tool.setuptools.ext-modules]]
name = "ssserve._server"
sources = ["ssserve/_server.c"]
libraries = ["pthread", "z"]

[tool.pytest.ini_options]
markers = [
    "profile: profiling tests (CPU, memory, sampling)",
    "c_server_config: C server config for redirects/rewrites",
    "slow: slow tests (performance, resources, profiling)",
]
testpaths = ["tests"]
addopts = "-n auto"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.0",
    "psutil>=6",
    "asv>=0.6.5",
    "setuptools>=83.0.0",
    "build",
    "memray>=1.12",
    "py-spy>=0.3.14",
]
