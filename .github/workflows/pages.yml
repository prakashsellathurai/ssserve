name: Publish ASV Benchmarks

on:
  workflow_run:
    workflows: ["Benchmarks"]
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: asv-results-${{ github.event.workflow_run.id }}
          path: .asv-new
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Merge new results into accumulated history
        run: |
          cp -r .asv-new/results/* .asv/results/ 2>/dev/null || true
          cp -r .asv-new/html/* .asv/html/ 2>/dev/null || true

      - name: Publish to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          uv run asv gh-pages --rewrite

      - name: Commit updated results back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .asv/results/
          git diff --cached --quiet || git commit -m "Update benchmark results [skip ci]" && git push origin main

      - name: Push to gh-pages
        run: git push origin gh-pages
