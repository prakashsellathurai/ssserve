name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  asv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate benchmarks are well-formed
        run: uv run asv check --python=same

      - name: Configure ASV machine
        run: |
          uv run python -c "
import platform, json, os
d = {
    'machine': platform.node(),
    'os': f'{platform.system()} {platform.release()}',
    'arch': platform.machine(),
    'cpu': 'unknown',
    'num_cpu': os.cpu_count() or 1,
    'ram': 'unknown',
}
os.makedirs(os.path.expanduser('~/.asv'), exist_ok=True)
with open(os.path.expanduser('~/.asv/machine.json'), 'w') as f:
    json.dump(d, f, indent=2)
"

      - name: Run benchmarks (quick)
        run: |
          git branch -f main HEAD 2>/dev/null || true
          uv run asv run --python=same --quick --show-stderr \
            --set-commit-hash=$(git rev-parse HEAD)

      - name: Publish benchmark HTML
        run: uv run asv publish

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: asv-results
          path: |
            .asv/results
            .asv/html
